<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1420">
<title>メカムシ・タクティクス</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪲</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- タイトル -->
<section id="scr-title" class="screen active">
  <div class="title-wrap">
    <div class="title-logo">
      <div class="logo-sub">昆虫ロボ シミュレーションRPG</div>
      <h1>メカムシ<br><span>タクティクス</span></h1>
    </div>
    <div class="title-art" id="titleArt"></div>
    <div class="menu" id="titleMenu"></div>
  </div>
</section>

<!-- メニュー系の汎用画面 -->
<section id="scr-page" class="screen">
  <header class="pagebar"><button class="back" id="pageBack">‹ 戻る</button><h2 id="pageTitle"></h2><div class="money" id="pageMoney"></div></header>
  <div class="page-body" id="pageBody"></div>
</section>

<!-- 戦闘 -->
<section id="scr-battle" class="screen">
  <header class="topbar">
    <span id="turnLabel">ターン 1</span>
    <span id="phaseLabel" class="phase player">自軍フェイズ</span>
    <button id="btnEnd" class="btn small">ターン終了</button>
    <button id="btnMenu" class="btn small gray">≡</button>
  </header>
  <div id="boardWrap">
    <div id="board"></div>
    <div id="unitLayer"></div>
    <div id="fxLayer"></div>
  </div>
  <div id="infoPanel"></div>
  <div id="sheet" class="sheet hidden"></div>
  <div id="banner" class="banner"></div>
</section>

<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/save.js"></script>
<script src="js/art.js"></script>
<script src="js/battle.js"></script>
<script src="js/main.js"></script>
</body>
</html>
